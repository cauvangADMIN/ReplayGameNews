<script>
let iframeAdQueue = Promise.resolve()

function loadIframeAd(slotId, key, width, height){
  iframeAdQueue = iframeAdQueue.then(()=> new Promise((resolve)=>{
    const slot = document.getElementById(slotId)

    if(!slot || slot.dataset.loaded === "true"){
      resolve()
      return
    }

    window.atOptions = {
      key,
      format: "iframe",
      height,
      width,
      params: {}
    }

    const script = document.createElement("script")
    script.src = `https://shorterwanderer.com/${key}/invoke.js`
    script.onload = resolve
    script.onerror = resolve
    slot.appendChild(script)
    slot.dataset.loaded = "true"
  }))

  return iframeAdQueue
}

function loadTopBannerAd(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches
  const mobileSlot = document.getElementById("top-ad-mobile-slot")

  if(isMobile){
    if(!mobileSlot || mobileSlot.dataset.loaded === "true") return
    const script = document.createElement("script")
    script.async = true
    script.setAttribute("data-cfasync", "false")
    script.src = "https://shorterwanderer.com/3331fbbbf1e79a5b35629c52a32779c9/invoke.js"
    mobileSlot.appendChild(script)
    mobileSlot.dataset.loaded = "true"
    return
  }

  loadIframeAd("top-ad-desktop-slot", "fbb415addb18ed475ecae9979848f5cb", 728, 90)
}

document.addEventListener("DOMContentLoaded", loadTopBannerAd)
</script>

<script>
function loadSideAds(){
