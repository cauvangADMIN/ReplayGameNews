backend:
  name: github
  repo: cauvangADMIN/ReplayGameNews
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

media_library:
  name: r2

collections:
  - name: posts
    label: Posts
    folder: posts
    create: true
    slug: "{{slug}}"

    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Category, name: category, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Excerpt, name: excerpt, widget: string }
      - label: Tags
        name: tags
        widget: list
        allow_add: true
        field:
          label: Tag
          name: tag
          widget: string
      - label: Article Blocks
        name: content_blocks
        widget: list
        summary: "{{fields.type}}"
        minimize_collapsed: true
        types:
          - label: Content Text
            name: text
            widget: object
            fields:
              - label: Text
                name: content
                widget: markdown
          - label: Carousel Slider
            name: carousel
            widget: object
            fields:
              - label: Carousel Images
                name: images
                widget: list
                allow_add: true
                minimize_collapsed: true
                summary: "{{fields.caption}}"
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Caption, name: caption, widget: string, required: false }
      - label: Legacy Body
        name: body
        widget: markdown
        required: false
        hint: "Only used for old posts that do not have Article Blocks."
