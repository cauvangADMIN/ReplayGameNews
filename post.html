  <script>

  // Get slug from query OR pretty URL
  function getSlug(){

    const url = new URL(location.href)

    // Case 1: /post.html?slug=xxx
    let slug = url.searchParams.get("slug")

    // Case 2: /resident-evil-puzzle
    if(!slug){
      const path = location.pathname.split("/")
      slug = path[path.length - 1]
    }

    return slug
  }

  const ignColors = [
    "#ffe7e7",
    "#e6bc9e",
    "#ecbb48",
    "#53f27d",
    "#96c5e9",
    "#c362ec",
    "#27f5da"
  ];

  function randomColor(){
    return ignColors[Math.floor(Math.random() * ignColors.length)];
  }

  function parseSimpleFrontmatter(fm){
    const meta = {}

    fm.split("\n").forEach(line=>{
      const idx = line.indexOf(":")
      if(idx > 0){
        const k = line.slice(0, idx).trim()
        const rest = line.slice(idx+1).trim()
        if(k) meta[k] = rest.replace(/^['"]|['"]$/g,"")
      }
    })

    const inlineTags = fm.match(/tags:\s*\[([^\]]*)\]/)
    if(inlineTags){
      meta.tags = inlineTags[1]
        .split(",")
        .map(t=>t.trim().replace(/^['"]|['"]$/g,""))
        .filter(Boolean)
    } else {
      const blockMatch = fm.match(/tags:\s*\n((?:\s*-\s*.*\n?)+)/)
      if(blockMatch){
        meta.tags = blockMatch[1]
          .split("\n")
          .map(l => l.trim())
          .filter(Boolean)
          .map(l => l.replace(/^-+\s*/,"").trim())
          .filter(Boolean)
      } else if(meta.tags && typeof meta.tags === "string" && meta.tags.indexOf(",") !== -1){
        meta.tags = meta.tags.split(",").map(t=>t.trim()).filter(Boolean)
      }
    }

    return meta
  }

  function parsePostMarkdown(md){
    const fmMatch = md.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/)

    if(!fmMatch){
      return { meta:{}, content:md }
    }

    const fm = fmMatch[1]
    const content = fmMatch[2]
    let meta = {}

    try{
      if(window.jsyaml){
        meta = window.jsyaml.load(fm) || {}
      } else {
        meta = parseSimpleFrontmatter(fm)
      }
    }catch(e){
      console.warn("frontmatter parse fallback", e)
      meta = parseSimpleFrontmatter(fm)
    }

    return { meta, content }
  }

  function normalizeTags(tags){
    if(!tags) return []

    if(Array.isArray(tags)){
      return tags
        .map(t => {
          if(typeof t === "string") return t
          if(t && typeof t === "object") return t.tag || t.name || ""
          return ""
        })
        .filter(Boolean)
    }

    if(typeof tags === "string"){
      return tags.split(",").map(t=>t.trim()).filter(Boolean)
    }

    return []
  }

  function formatDateMeta(date){
    if(!date) return ""
    if(date instanceof Date && !Number.isNaN(date.getTime())){
      return date.toISOString().slice(0,10)
    }
    return String(date)
  }

  function escapeHtml(value){
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
  }

  function normalizeCarouselImages(images){
    if(!Array.isArray(images)) return []

    return images
      .map(item => {
        if(typeof item === "string"){
          return { image:item, caption:"" }
        }

        if(item && typeof item === "object"){
          return {
            image:item.image || item.url || item.src || "",
            caption:item.caption || item.alt || ""
          }
        }

        return { image:"", caption:"" }
      })
      .filter(item => item.image)
  }

  function renderArticleCarousel(block, index){
    const images = normalizeCarouselImages(block.images || block.slides)
    if(!images.length) return ""

    const label = block.title || `Image carousel ${index + 1}`

    return `
      <section class="article-carousel" data-article-carousel aria-label="${escapeHtml(label)}">
        <div class="article-carousel-viewport">
          <button class="article-carousel-btn article-carousel-prev" type="button" aria-label="Previous image" data-carousel-prev>‹</button>
          <div class="article-carousel-track" data-carousel-track tabindex="0">
            ${images.map((item, imageIndex)=>`
              <figure class="article-carousel-slide">
                <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.caption || label)}" loading="lazy">
                ${item.caption ? `<figcaption>${escapeHtml(item.caption)}</figcaption>` : ""}
              </figure>
            `).join("")}
          </div>
          <button class="article-carousel-btn article-carousel-next" type="button" aria-label="Next image" data-carousel-next>›</button>
        </div>
        ${images.length > 1 ? `
          <div class="article-carousel-dots" aria-label="Carousel pagination">
            ${images.map((_, dotIndex)=>`
              <button type="button" data-carousel-dot="${dotIndex}" aria-label="Go to image ${dotIndex + 1}"></button>
            `).join("")}
          </div>
        ` : ""}
      </section>
    `
  }

  function renderContentBlocks(blocks, legacyContent){
    if(Array.isArray(blocks) && blocks.length){
      return blocks.map((block, index)=>{
        const type = (block.type || block.widget || block.kind || "").toLowerCase()

        if(type === "carousel"){
          return renderArticleCarousel(block, index)
        }

        return marked.parse(block.content || block.text || "")
      }).join("")
    }

    return marked.parse(legacyContent || "")
  }

  function initArticleCarousels(root = document){
    root.querySelectorAll("[data-article-carousel]").forEach(carousel=>{
      const track = carousel.querySelector("[data-carousel-track]")
      const slides = Array.from(carousel.querySelectorAll(".article-carousel-slide"))
      const prev = carousel.querySelector("[data-carousel-prev]")
      const next = carousel.querySelector("[data-carousel-next]")
      const dots = Array.from(carousel.querySelectorAll("[data-carousel-dot]"))

      if(!track || !slides.length) return

      if(slides.length <= 1){
        carousel.classList.add("is-single")
      }

      let activeIndex = 0
      let scrollFrame = null

      function setActive(index){
        activeIndex = Math.max(0, Math.min(index, slides.length - 1))
        dots.forEach((dot, dotIndex)=>{
          dot.classList.toggle("is-active", dotIndex === activeIndex)
        })
      }

      function goTo(index){
        const nextIndex = (index + slides.length) % slides.length
        track.scrollTo({
          left: track.clientWidth * nextIndex,
          behavior: "smooth"
        })
        setActive(nextIndex)
      }

      function updateFromScroll(){
        const index = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1))
        setActive(index)
        scrollFrame = null
      }

      prev && prev.addEventListener("click", ()=>goTo(activeIndex - 1))
      next && next.addEventListener("click", ()=>goTo(activeIndex + 1))
      dots.forEach((dot, index)=>{
        dot.addEventListener("click", ()=>goTo(index))
      })
      track.addEventListener("scroll", ()=>{
        if(scrollFrame) return
        scrollFrame = requestAnimationFrame(updateFromScroll)
      }, { passive:true })

      setActive(0)
    })
  }

  function initLazyAds(){
    const ads = document.querySelectorAll(".lazy-ad")
    const observer = new IntersectionObserver((entries, obs)=>{

      entries.forEach(entry=>{

        if(entry.isIntersecting){
          const ad = entry.target
          try{
            (adsbygoogle = window.adsbygoogle || []).push({})
          }catch(e){
            console.log("ads error", e)
          }
          obs.unobserve(ad)
        }
      })
    },{
      rootMargin: "200px"  // preload trước khi user thấy
    })

    ads.forEach(ad => observer.observe(ad))
  }

  async function loadPost(){

    const slug = getSlug()

    if(!slug){
      document.body.innerHTML = "<p>Missing slug</p>"
      return
    }

    try{

      const res = await fetch(`/posts/${slug}.md`, { cache:"no-store" })

      if(!res.ok){
        document.body.innerHTML = "<p>Post not found</p>"
        return
      }

      const md = await res.text()
      const parsedPost = parsePostMarkdown(md)
      const meta = parsedPost.meta
      const content = parsedPost.content
      const tags = normalizeTags(meta.tags)

      // Title
      document.getElementById("page-title").innerText = meta.title || slug
      document.getElementById("post-title").innerText = meta.title || slug

      if(meta.thumbnail){
        const ogImage = document.querySelector('meta[property="og:image"]')
        if(ogImage) ogImage.setAttribute("content", meta.thumbnail)
      }

      // Meta row
      document.getElementById("post-meta").innerText =
        `${formatDateMeta(meta.date)} • ${meta.category || ""}`

      // Content
      const container = document.getElementById("post-content")
      container.innerHTML = renderContentBlocks(meta.content_blocks || meta.contentBlocks || meta.blocks, content)
      initArticleCarousels(container)

      // render tags (below content)
      const tagsContainer = document.getElementById("post-tags")
      if(tags.length){
        tagsContainer.setAttribute("aria-hidden", "false")
        tagsContainer.innerHTML = `
          <div class="tags-title">Tags:</div>
          <div class="tags-row">
            ${tags.map(t=>`<a class="tag" href="/?tag=${encodeURIComponent(t)}">${escapeHtml(t)}</a>`).join("")}
          </div>
        `
      } else {
        tagsContainer.setAttribute("aria-hidden", "true")
        tagsContainer.innerHTML = ""
      }

      // insert in-article ad
      const paragraphs = container.querySelectorAll("p")

      let inserted = false
      let fallbackTarget = null

      for(let i = 0; i < paragraphs.length; i++){

        const p = paragraphs[i]

        const lengthOk = p.innerText.length >= 120
        const next = p.nextElementSibling
        const notNearMedia = !(next && (next.tagName === "IMG" || next.classList.contains("article-carousel")))

        const ratio = i / paragraphs.length
        const goodPosition = ratio >= 0.25

        // 👉 PRIMARY (best UX)
        if(lengthOk && notNearMedia && goodPosition){

          insertAdAfter(p)
          inserted = true
          break
        }

        // 👉 save fallback candidate (chỉ cần ok cơ bản)
        if(!fallbackTarget && lengthOk){
          fallbackTarget = p
        }
      }

      /* =========================
        FALLBACK (guarantee 1 ad)
      ========================= */

      if(!inserted){

        if(fallbackTarget){
          insertAdAfter(fallbackTarget)
        } 
        else if(paragraphs[1]){
          // fallback cuối cùng: paragraph thứ 2
          insertAdAfter(paragraphs[1])
        }
      }

      /* helper */
      function insertAdAfter(p){

        const ad = document.createElement("div")
        ad.className = "article-ad"
        ad.innerHTML = `
          <ins class="adsbygoogle lazy-ad"
              style="display:block"
              data-ad-client="ca-pub-XXXX"
              data-ad-slot="XXXX"
              data-ad-format="auto"
              data-full-width-responsive="true"></ins>
        `

        p.after(ad)
      }

      // Render related posts (right after content & tags)
      renderRelatedPosts((meta.category || "").toLowerCase(), slug)

      initLazyAds()
    }
    catch(e){

      console.error(e)
      document.body.innerHTML = "<p>Error loading post</p>"

    }

  } // end loadPost()

  /***** RELATED POSTS RENDERER *****/

  async function renderRelatedPosts(category, currentSlug){

    const container = document.getElementById("related-posts")
    if(!container) return

    try{
      const res = await fetch("/posts/posts.json")
      if(!res.ok) {
        container.innerHTML = ""
        return
      }
      let posts = await res.json()

      // normalize category and filter same category (case-insensitive)
      const sameCat = posts.filter(p => (p.category || "").toLowerCase() === (category || "").toLowerCase() && p.slug !== currentSlug)

      if(sameCat.length === 0){
        // fallback: choose any except current
        posts = posts.filter(p => p.slug !== currentSlug)
        // small random sample
        posts = shuffle(posts).slice(0,8)
      } else {
        posts = shuffle(sameCat).slice(0,12)
      }

      if(posts.length === 0){
        container.innerHTML = ""
        return
      }

      // build slider HTML
      container.innerHTML = `
        <div class="related-header">
          <h3 class="related-title">Related posts</h3>

          <div class="related-controls desktop-only">
            <button id="rel-prev" class="rel-btn">‹</button>
            <button id="rel-next" class="rel-btn">›</button>
          </div>
        </div>

        <div class="related-track grid" id="related-track">
          ${posts.map(p => `
            <article class="card related-card">
              <a href="/${p.slug}">
                <img src="${p.thumbnail}" alt="${p.title}">
                <div class="card-color" style="background:${randomColor()}"></div>
                <div class="card-content">
                  <div class="cat">${p.category || ''}</div>
                  <h3>${p.title}</h3>
                </div>
              </a>
            </article>
          `).join("")}
        </div>
      `

      // init controls
      const track = document.getElementById("related-track")
      const prev = document.getElementById("rel-prev")
      const next = document.getElementById("rel-next")

      // desktop next/prev behavior
      function scrollByViewport(multiplier = 1){
        const card = track.querySelector(".related-card")
        if(!card) return
        const gap = parseInt(getComputedStyle(track).gap || 16)
        const cardW = card.offsetWidth + gap
        const visible = Math.floor(track.clientWidth / cardW) || 1
        track.scrollBy({ left: cardW * visible * multiplier, behavior: "smooth" })
      }

      if(prev && next){
        prev.addEventListener("click", ()=> scrollByViewport(-1))
        next.addEventListener("click", ()=> scrollByViewport(1))
      }

      // enable smooth loop on mobile auto scroll (optional)
      // ensure ads in related cards (none) – no ad handling needed

    }catch(err){
      console.error("related error", err)
    }
  }

  // helper: shuffle (reuse earlier function or re-declare)
  function shuffle(arr){
    return arr.map(v => ({v, r: Math.random()})).sort((a,b)=>a.r-b.r).map(({v})=>v)
  }

  document.addEventListener("DOMContentLoaded", loadPost)

  </script>

<script>
(function(){
  let detailIframeAdQueue = Promise.resolve()
  const iframeAdSettleMs = 800
  const iframeAdTimeoutMs = 5000

  function wait(ms){
    return new Promise(resolve => window.setTimeout(resolve, ms))
  }

  function loadDetailIframeAd(slotId, key, width, height){
    detailIframeAdQueue = detailIframeAdQueue.then(async ()=>{
      const slot = document.getElementById(slotId)

      if(!slot || slot.dataset.loaded === "true"){
        return
      }

      window.atOptions = {
        key,
        format: "iframe",
        height,
        width,
        params: {}
      }

      const script = document.createElement("script")
      script.src = `https://shorterwanderer.com/${key}/invoke.js`

      const scriptFinished = new Promise(resolve => {
        let timeoutId
        const finish = () => {
          window.clearTimeout(timeoutId)
          resolve()
        }

        timeoutId = window.setTimeout(finish, iframeAdTimeoutMs)
        script.onload = finish
        script.onerror = finish
      })

      slot.appendChild(script)
      slot.dataset.loaded = "true"

      await scriptFinished
      await wait(iframeAdSettleMs)
    })

    return detailIframeAdQueue
  }

  async function loadDetailSideAds(){
    if(!window.matchMedia("(min-width: 1460px)").matches) return

    await loadDetailIframeAd("detail-side-ad-left-slot", "69c7c73901ea591ee931a958701fd9dc", 160, 600)
    await loadDetailIframeAd("detail-side-ad-right-slot", "792de38c9f29562a8009fa70417cbf3d", 160, 600)
  }

  document.addEventListener("DOMContentLoaded", loadDetailSideAds)
})()
</script>
